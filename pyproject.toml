[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "docparser"
version = "1.0.0"
description = "Local, permissively licensed text/structure extraction for PDF, DOCX, PPTX, PPT, ODT, HWPX, XLSX"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pdfplumber>=0.11.4",
    "pdfminer.six>=20240706",
    "python-docx>=1.1.2",
    "python-pptx>=1.0.2",
    "odfpy>=1.4.1",
    "olefile>=0.47",
    "openpyxl>=3.1",
    "lxml>=5.0",
    "defusedxml>=0.7.1",
]

[project.optional-dependencies]
mojibake = ["ftfy>=6.2"]
dev = ["pytest>=8", "reportlab>=4"]

[project.scripts]
docparser = "docparser.__main__:main"

[tool.setuptools.packages.find]
include = ["docparser*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
